<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NexusMote">
  <title>NexusMote</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>NexusMote</h1>
      <div class="connection-status" id="connectionStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </header>

    <nav class="tab-bar" role="tablist">
      <button class="tab-btn active" role="tab" data-tab="deck" aria-selected="true">
        <svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="12" y="3" width="6" height="6" rx="1"/><rect x="21" y="3" width="6" height="6" rx="1"/><rect x="3" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/><rect x="21" y="12" width="6" height="6" rx="1"/></svg>
        <span>Deck</span>
      </button>
      <button class="tab-btn" role="tab" data-tab="mouse" aria-selected="false">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M7 4a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H4a2 2 0 0 1-2-2V4zm0 2v10h16V4H7z"/></svg>
        <span>Mouse</span>
      </button>
      <button class="tab-btn" role="tab" data-tab="monitor" aria-selected="false">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span>Monitor</span>
      </button>
    </nav>

    <main class="tab-content">
      <section class="tab-panel active" id="deckPanel" role="tabpanel">
        <div class="deck-grid" id="deckGrid"></div>
      </section>

      <section class="tab-panel" id="mousePanel" role="tabpanel">
        <div class="touchpad" id="touchpad" role="trackpad" aria-label="Touchpad area">
          <div class="touchpad-indicator"></div>
        </div>
        <div class="mouse-buttons">
          <button class="mouse-btn" data-button="left" aria-label="Left click">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </button>
          <button class="mouse-btn" data-button="right" aria-label="Right click">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="15 22 15 12 9 12 9 22"/></svg>
          </button>
        </div>
        <div class="mouse-extra">
          <button class="arrow-btn" data-key="Left" aria-label="Left arrow (PowerPoint previous)">
            <svg viewBox="0 0 24 24" width="24" height="24"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="arrow-btn" data-key="Right" aria-label="Right arrow (PowerPoint next)">
            <svg viewBox="0 0 24 24" width="24" height="24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="keyboard-toggle" id="keyboardToggle" aria-label="Virtual keyboard">
            <svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 9h10M7 14h10M7 19h7"/></svg>
          </button>
        </div>
        <div class="scroll-hint" id="scrollHint">Drag to move · Two-finger scroll · Arrow keys for PowerPoint</div>
      </section>

      <section class="tab-panel" id="monitorPanel" role="tabpanel">
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-icon cpu-icon">
              <svg viewBox="0 0 24 24" width="28" height="28"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v4M15 4v4M4 9h4M16 9h4M9 20v-4M15 20v-4M4 15h4M16 15h4"/></svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">CPU</span>
              <span class="metric-value" id="cpuUsage">--%</span>
            </div>
            <div class="metric-bar"><div class="metric-fill" id="cpuBar" style="width: 0%"></div></div>
          </div>

          <div class="metric-card">
            <div class="metric-icon ram-icon">
              <svg viewBox="0 0 24 24" width="28" height="28"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 6V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">RAM</span>
              <span class="metric-value" id="ramUsage">--%</span>
            </div>
            <div class="metric-bar"><div class="metric-fill" id="ramBar" style="width: 0%"></div></div>
          </div>

          <div class="metric-card">
            <div class="metric-icon gpu-icon">
              <svg viewBox="0 0 24 24" width="28" height="28"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/><path d="M12 22V12M22 8.5L12 15.5L2 8.5"/></svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">GPU</span>
              <span class="metric-value" id="gpuUsage">N/A</span>
            </div>
            <div class="metric-bar"><div class="metric-fill" id="gpuBar" style="width: 0%"></div></div>
          </div>

          <div class="metric-card">
            <div class="metric-icon net-icon">
              <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 2a10 10 0 0 1 10 10"/><path d="M2 12a10 10 0 0 1 10-10"/><path d="M22 12a10 10 0 0 1-10 10"/><path d="M12 22a10 10 0 0 1-10-10"/></svg>
            </div>
            <div class="metric-info">
              <span class="metric-label">Network</span>
              <span class="metric-value" id="netUsage">--</span>
            </div>
            <div class="metric-bar"><div class="metric-fill" id="netBar" style="width: 0%"></div></div>
          </div>
        </div>

        <div class="metrics-detail">
          <div class="detail-card">
            <h3>System</h3>
            <div class="detail-row"><span>Uptime</span><span id="uptime">--</span></div>
            <div class="detail-row"><span>CPU Cores</span><span id="cpuCores">--</span></div>
          </div>
          <div class="detail-card">
            <h3>Memory</h3>
            <div class="detail-row"><span>Total</span><span id="memTotal">--</span></div>
            <div class="detail-row"><span>Used</span><span id="memUsed">--</span></div>
            <div class="detail-row"><span>Available</span><span id="memAvailable">--</span></div>
          </div>
          <div class="detail-card" id="gpuDetail" style="display: none">
            <h3>GPU</h3>
            <div class="detail-row"><span>Name</span><span id="gpuName">--</span></div>
            <div class="detail-row"><span>VRAM</span><span id="gpuMem">--</span></div>
            <div class="detail-row"><span>Temp</span><span id="gpuTemp">--</span></div>
          </div>
        </div>
      </section>
    </main>

    <div class="modal" id="actionModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-content">
        <header class="modal-header">
          <h2 id="modalTitle">Add Action</h2>
          <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
        </header>
        <form id="actionForm">
          <div class="form-group">
            <label for="actionName">Name</label>
            <input type="text" id="actionName" required placeholder="My Action">
          </div>
          <div class="form-group">
            <label for="actionType">Type</label>
            <select id="actionType" required>
              <option value="launch">Launch Application</option>
              <option value="volume">Set Volume</option>
              <option value="mute">Toggle Mute</option>
              <option value="media">Media Control</option>
              <option value="workspace">Switch Workspace</option>
            </select>
          </div>
          <div class="form-group" id="actionParams"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <div class="modal" id="keyboardModal" role="dialog" aria-modal="true" aria-labelledby="keyboardTitle">
      <div class="modal-content keyboard-modal">
        <header class="modal-header">
          <h2 id="keyboardTitle">Virtual Keyboard</h2>
          <button class="modal-close" id="keyboardClose" aria-label="Close">&times;</button>
        </header>
        <div class="keyboard-container">
          <div class="keyboard-row">
            <button class="key" data-key="Escape">Esc</button>
            <button class="key" data-key="F1">F1</button>
            <button class="key" data-key="F2">F2</button>
            <button class="key" data-key="F3">F3</button>
            <button class="key" data-key="F4">F4</button>
            <button class="key" data-key="F5">F5</button>
            <button class="key" data-key="F6">F6</button>
            <button class="key" data-key="F7">F7</button>
            <button class="key" data-key="F8">F8</button>
            <button class="key" data-key="F9">F9</button>
            <button class="key" data-key="F10">F10</button>
            <button class="key" data-key="F11">F11</button>
            <button class="key" data-key="F12">F12</button>
          </div>
          <div class="keyboard-row">
            <button class="key" data-key="`">`</button>
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key" data-key="0">0</button>
            <button class="key" data-key="-">-</button>
            <button class="key" data-key="=">=</button>
            <button class="key wide" data-key="Backspace">⌫</button>
          </div>
          <div class="keyboard-row">
            <button class="key wide" data-key="Tab">Tab</button>
            <button class="key" data-key="q">Q</button>
            <button class="key" data-key="w">W</button>
            <button class="key" data-key="e">E</button>
            <button class="key" data-key="r">R</button>
            <button class="key" data-key="t">T</button>
            <button class="key" data-key="y">Y</button>
            <button class="key" data-key="u">U</button>
            <button class="key" data-key="i">I</button>
            <button class="key" data-key="o">O</button>
            <button class="key" data-key="p">P</button>
            <button class="key" data-key="[">[</button>
            <button class="key" data-key="]">]</button>
            <button class="key" data-key="\\">\\</button>
          </div>
          <div class="keyboard-row">
            <button class="key wide" data-key="CapsLock">⇪</button>
            <button class="key" data-key="a">A</button>
            <button class="key" data-key="s">S</button>
            <button class="key" data-key="d">D</button>
            <button class="key" data-key="f">F</button>
            <button class="key" data-key="g">G</button>
            <button class="key" data-key="h">H</button>
            <button class="key" data-key="j">J</button>
            <button class="key" data-key="k">K</button>
            <button class="key" data-key="l">L</button>
            <button class="key" data-key=";">;</button>
            <button class="key" data-key="'">'</button>
            <button class="key wide" data-key="Enter">↵</button>
          </div>
          <div class="keyboard-row">
            <button class="key wide" data-key="ShiftLeft">⇧</button>
            <button class="key" data-key="z">Z</button>
            <button class="key" data-key="x">X</button>
            <button class="key" data-key="c">C</button>
            <button class="key" data-key="v">V</button>
            <button class="key" data-key="b">B</button>
            <button class="key" data-key="n">N</button>
            <button class="key" data-key="m">M</button>
            <button class="key" data-key=",">,</button>
            <button class="key" data-key=".">.</button>
            <button class="key" data-key="/">/</button>
            <button class="key wide" data-key="ShiftRight">⇧</button>
          </div>
          <div class="keyboard-row">
            <button class="key" data-key="ControlLeft">Ctrl</button>
            <button class="key" data-key="MetaLeft">⌘</button>
            <button class="key" data-key="AltLeft">Alt</button>
            <button class="key wide space" data-key="Space"></button>
            <button class="key" data-key="AltRight">Alt</button>
            <button class="key" data-key="MetaRight">⌘</button>
            <button class="key" data-key="ControlRight">Ctrl</button>
            <button class="key" data-key="ArrowLeft">←</button>
            <button class="key" data-key="ArrowUp">↑</button>
            <button class="key" data-key="ArrowRight">→</button>
            <button class="key" data-key="ArrowDown">↓</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
