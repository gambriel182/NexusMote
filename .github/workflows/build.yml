name: Build NexusMote

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: |
          cd desktop
          npm ci

      - name: Build AppImage
        run: |
          cd desktop
          npm run pack

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: NexusMote-AppImage
          path: desktop/release/*.AppImage
          retention-days: 30

  build-mobile:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          cd mobile
          npm ci

      - name: Configure EAS
        run: |
          cd mobile
          eas build:configure

      - name: Build Android APK
        run: |
          cd mobile
          eas build --platform android --profile production --non-interactive --wait

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusMote-APK
          path: mobile/build/*.apk
          retention-days: 30

  release:
    name: Create Release
    needs: [build-desktop, build-mobile]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: NexusMote-AppImage
          path: release-assets

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: NexusMote-APK
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true