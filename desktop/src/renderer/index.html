<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusMote</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">🖱️</span>
      <h1>NexusMote</h1>
    </div>

    <p class="subtitle">Turn your phone into a wireless touchpad</p>

    <div class="status" id="status">
      <span class="dot" id="dot"></span>
      <span class="status-text" id="statusText">Starting…</span>
    </div>

    <div class="device-name" id="deviceName" style="display:none;"></div>

    <div class="section" id="pairSection" style="display:none;">
      <div class="info-row">
        <span class="label">Server</span>
        <span class="value" id="serverAddr">—</span>
      </div>
      <div class="info-row">
        <span class="label">Port</span>
        <span class="value" id="serverPort">—</span>
      </div>

      <canvas id="qrCanvas" width="220" height="220"></canvas>
      <p class="hint">Scan with your phone camera</p>
    </div>

    <button class="btn" id="quitBtn">Quit</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
